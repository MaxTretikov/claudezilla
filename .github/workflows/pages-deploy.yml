name: Pages Deploy

# Deploys the website/ directory to the claudezilla Cloudflare Pages project.
# Authenticates via the Cloudflare API directly, bypassing the GitHub
# org-connection that previously forced manual `wrangler pages deploy` runs.
#
# To enable automatic deploys on push, uncomment the `push:` trigger below.
# Until then this workflow only runs on manual dispatch from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you deploying? (for audit log)'
        required: false
        default: 'manual deploy'
  # push:
  #   branches: [main]
  #   paths:
  #     - 'website/**'
  #     - '.github/workflows/pages-deploy.yml'

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Deploy to Cloudflare Pages
        # cloudflare/wrangler-action v4.0.0
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=claudezilla
