name = "claudezilla-worker"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[vars]
FRONTEND_URL = "https://claudezilla.com"

# Secrets (set via: wrangler secret put STRIPE_SECRET_KEY)
# STRIPE_SECRET_KEY (required) - Stripe API secret key (sk_...)
# STRIPE_WEBHOOK_SECRET (optional, for future webhook handling)

# D1 Database for email signups (claudezilla-emails) — NOT YET CREATED.
# The /notify endpoint in src/index.ts depends on the DB binding. To activate:
#   1. wrangler d1 create claudezilla-emails
#   2. Copy database_id from output, paste below
#   3. wrangler d1 execute claudezilla-emails --file=../schema.sql
#   4. Uncomment the [[d1_databases]] block below
#   5. wrangler deploy
# [[d1_databases]]
# binding = "DB"
# database_name = "claudezilla-emails"
# database_id = "<REPLACE_WITH_DATABASE_ID_FROM_WRANGLER_CREATE>"
